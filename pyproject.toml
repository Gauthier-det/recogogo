[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recogogo"
version = "0.1.0"
description = "Système de recommandation musicale à partir d'une liste de sons"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pyarrow",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
